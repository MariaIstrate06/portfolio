name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: istrateu/package-lock.json

      - name: Install dependencies
        working-directory: istrateu
        run: npm ci

      - name: Build (static, base href /portfolio/)
        working-directory: istrateu
        run: npx ng build --base-href=/portfolio/

      - name: Use CSR fallback as root index.html
        run: mv istrateu/dist/istrateu/browser/index.csr.html istrateu/dist/istrateu/browser/index.html

      - name: Add 404.html fallback for GitHub Pages deep links
        run: cp istrateu/dist/istrateu/browser/index.html istrateu/dist/istrateu/browser/404.html

      - name: Add .nojekyll
        run: touch istrateu/dist/istrateu/browser/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: istrateu/dist/istrateu/browser
