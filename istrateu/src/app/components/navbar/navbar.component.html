<nav class="navbar">
  <div class="nav-links" [class.open]="menuOpen">
    <button class="close-btn" (click)="closeMenu()" aria-label="Close menu">
      <i class="bi bi-x-lg"></i>
    </button>

    <button
      class="btn-navbar home-btn"
      routerLink="/home"
      routerLinkActive="active"
      (click)="onHomeClick()"
    >
      hello, world
      <i
        class="bi bi-bandaid band-aid"
        [class.spin]="spinBandAid"
        (animationend)="spinBandAid = false"
      ></i>
    </button>
    <button class="btn-navbar" routerLink="/about" routerLinkActive="active" (click)="closeMenu()">about me</button>
    <button class="btn-navbar" routerLink="/cv" routerLinkActive="active" (click)="closeMenu()">my cv</button>
    <button class="btn-navbar" routerLink="/work" routerLinkActive="active" (click)="closeMenu()">my work</button>
    <button class="btn-navbar" routerLink="/receipts" routerLinkActive="active" (click)="closeMenu()">the receipts</button>
    <button class="btn-navbar" routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">contact</button>
  </div>

  <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Open menu">
    <i class="bi bi-list"></i>
  </button>
</nav>
