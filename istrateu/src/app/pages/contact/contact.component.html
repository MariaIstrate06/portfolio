<section class="contact-page">
  @if (site$ | async; as site) {
    <h1>let's connect</h1>
    <p class="intro">{{ site.contact.intro }}</p>

    <div class="contact-card">
      <div class="row">
        <span class="label">email</span>
        <span class="value">{{ site.email }}</span>
      </div>

      <div class="actions">
        <button type="button" class="btn" (click)="contactByEmail(site.email)">
          contact me
        </button>
        <button type="button" class="btn-outline" (click)="copyEmail(site.email)">
          {{ copied ? 'copied!' : 'copy email' }}
        </button>
      </div>

      <div class="socials">
        @for (s of site.social; track s.url) {
          <a [href]="s.url" target="_blank" rel="noopener noreferrer">{{ s.label }}</a>
        }
      </div>
    </div>
  }
</section>
